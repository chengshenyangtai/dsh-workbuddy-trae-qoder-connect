# dsh-connect —— 唯一的 connect 插件（取代原来的四个）：
#   dsh-workbuddy-connect / dsh-trae-connect / dsh-qoder-connect / dsh-connect-hub
#
# 它一个 bundle 里同时做两件事：
#   1. 把三个渠道的宿主半侧作为**子模块**在本进程内 apply（各自注册 provider、
#      回环 shim、状态/签到路由；provider id 与状态文件路径全部沿用，故无需重配）；
#   2. 挂统一面板：/plugins/dsh-connect/{status,checkin,checkin/<id>,settings}。
#
# 凭据仍走各自的老约定，插件本身不读任何密文：
#   WorkBuddy : 环境变量 WORKBUDDY1/2/3_AUTH_FILE（宿主导出的明文快照）
#   Trae      : $DSH_HOME/connect-auth/trae.json（模型目录按产品分：
#               trae-cn/models.json = Trae CN，trae/models.json = TRAE SOLO CN；
#               用哪个产品由凭据里的 product 字段决定，见 providers/trae/index.js）
#   Qoder     : $DSH_HOME/qoder/pat 或 QODERCN_PAT
- insert:
    - id: dsh-connect
      name: dsh-connect
